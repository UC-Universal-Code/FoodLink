name: foodlink
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Dependencias para seguridad y manejo de estado
  flutter_secure_storage: ^9.2.2  # Almacenamiento seguro de tokens
  dio: ^5.4.0                     # Cliente HTTP para peticiones al backend
  provider: ^6.1.1                # Manejo de estado

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#20303D"
  adaptive_icon_foreground: "assets/icon/icon.png"